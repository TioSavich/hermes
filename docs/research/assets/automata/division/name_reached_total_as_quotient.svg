  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: register_givens</title><tspan x="376.0" y="239.9">set_factor</tspan></text>
  <path class="edge-neutral" d="M 417.2 303.7 Q 449.3 362.0 391.2 383.6" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>count_by_factor_until_total → count_up_to_target (neutral)</title></path>
