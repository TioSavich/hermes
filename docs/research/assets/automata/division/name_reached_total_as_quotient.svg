  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#b95238" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: misname_result</title><tspan x="321.8" y="412.5">name_reached_total</tspan><tspan x="321.8" y="422.9">as_answer</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#b95238" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: record_loss</title><tspan x="227.6" y="351.9">lose_iteration_count</tspan></text>
