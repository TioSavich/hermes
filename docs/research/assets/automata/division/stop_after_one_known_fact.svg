<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">division / stop_after_one_known_fact</title>
  <desc id="desc">States are arranged radially. Edge color records the authored stance: dark for conserving, rust for deforming, and muted for neutral. Dashed edges have observed-only provenance.</desc>
  <defs>
    <marker id="arrow-conserving" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0d0c08"/></marker>
    <marker id="arrow-deforming" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b95238"/></marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#665f4f"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d4a747"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f4ead6"/>
  <path class="edge-neutral" d="M 335.6 221.0 Q 388.0 202.2 391.9 253.5" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>load_known_multiples → retrieve_known_fact (neutral)</title></path>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: retrieve_known_fact</title><tspan x="368.9" y="231.9">load_known_multiples</tspan></text>
  <path class="edge-neutral" d="M 413.5 284.0 Q 456.0 320.0 413.5 349.0" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>apply_first_known_multiple_only → measure_out_group_size (neutral)</title></path>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: measure_out_group_size</title><tspan x="420.8" y="313.1">apply_first_known</tspan><tspan x="420.8" y="323.4">multiple_only</tspan></text>
  <path class="edge-deforming" d="M 397.9 383.0 Q 388.0 437.8 341.7 415.5" fill="none" stroke="#b95238" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-deforming)"><title>stop_with_remaining_total → halt_before_completion (deforming)</title></path>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#b95238" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: halt_before_completion</title><tspan x="371.9" y="401.2">stop_with_remaining</tspan><tspan x="371.9" y="411.6">total</tspan></text>
  <path class="edge-deforming" d="M 304.4 419.0 Q 252.0 437.8 248.1 386.5" fill="none" stroke="#b95238" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-deforming)"><title>name_partial_quotient_and_remainder → misname_result (deforming)</title></path>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#b95238" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: misname_result</title><tspan x="271.1" y="397.7">name_partial</tspan><tspan x="271.1" y="408.1">quotient_and</tspan><tspan x="271.1" y="418.5">remainder</tspan></text>
  <path class="edge-deforming" d="M 226.5 356.0 Q 184.0 320.0 226.5 291.0" fill="none" stroke="#b95238" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-deforming)"><title>lose_iterative_fact_decomposition → record_loss (deforming)</title></path>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#b95238" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: record_loss</title><tspan x="219.2" y="316.6">lose_iterative_fact</tspan><tspan x="219.2" y="327.0">decomposition</tspan></text>
