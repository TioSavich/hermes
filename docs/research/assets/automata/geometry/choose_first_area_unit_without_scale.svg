  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: select_unit_scale</title><tspan x="386.4" y="378.7">select_first</tspan><tspan x="386.4" y="389.1">familiar_unit</tspan></text>
