  <path class="edge-neutral" d="M 264.2 410.8 Q 214.5 411.3 230.4 368.5" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>compare_final_products → compare_magnitudes (neutral)</title></path>
