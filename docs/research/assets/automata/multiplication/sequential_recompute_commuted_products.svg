  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: register_givens</title><tspan x="368.6" y="222.1">compare_factor</tspan><tspan x="368.6" y="232.5">orders</tspan></text>
  <path class="validity-blue-base" d="M 415.6 271.7 Q 460.5 292.8 427.6 324.5" fill="none" stroke="#2e6f9e" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow-validity-blue)"><title>miss_structural_commutative_equivalence → omit_required_step; modes context_sensitive_or_inefficient; review status adjudicated</title></path>
