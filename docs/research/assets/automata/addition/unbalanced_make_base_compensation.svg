  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: count_up_to_target</title><tspan x="408.3" y="383.8">count_distance_to</tspan><tspan x="408.3" y="394.2">base</tspan></text>
