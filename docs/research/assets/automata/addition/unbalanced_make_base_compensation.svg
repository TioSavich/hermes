  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: assign_roles</title><tspan x="368.6" y="227.3">order_addends</tspan></text>
  <path class="edge-neutral" d="M 415.6 271.7 Q 460.5 292.8 427.6 324.5" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>identify_target_base → select_unit_scale (neutral)</title></path>
