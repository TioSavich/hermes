  <path class="edge-neutral" d="M 226.5 356.0 Q 184.0 320.0 226.5 291.0" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>name_distance_not_endpoint → name_result (neutral)</title></path>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: name_result</title><tspan x="219.2" y="316.6">name_distance_not</tspan><tspan x="219.2" y="327.0">endpoint</tspan></text>
