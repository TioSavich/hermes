  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: assign_roles</title><tspan x="368.9" y="231.9">start_at_subtrahend</tspan></text>
  <path class="edge-neutral" d="M 413.5 284.0 Q 456.0 320.0 413.5 349.0" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>target_minuend → assign_roles (neutral)</title></path>
