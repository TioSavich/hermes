  <path class="edge-neutral" d="M 397.9 383.0 Q 388.0 437.8 341.7 415.5" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>count_up_by_bases → count_up_to_target (neutral)</title></path>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: count_up_to_target</title><tspan x="371.9" y="406.4">count_up_by_bases</tspan></text>
  <path class="edge-neutral" d="M 304.4 419.0 Q 252.0 437.8 248.1 386.5" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>count_up_by_ones → count_up_to_target (neutral)</title></path>
