  <path class="edge-neutral" d="M 365.5 407.4 Q 320.0 456.0 281.5 407.4" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>establish_frequency_scale → establish_reference_frame (neutral)</title></path>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: establish_reference_frame</title><tspan x="321.8" y="412.5">establish_frequency</tspan><tspan x="321.8" y="422.9">scale</tspan></text>
