  <path class="edge-neutral" d="M 417.2 303.7 Q 449.3 362.0 391.2 383.6" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>count_each_category → count_units (neutral)</title></path>
