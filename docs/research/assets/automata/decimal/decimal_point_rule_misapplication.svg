  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#b95238" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: substitute_operation</title><tspan x="371.9" y="396.0">take_max_of_place</tspan><tspan x="371.9" y="406.4">counts_instead_of</tspan><tspan x="371.9" y="416.8">summing</tspan></text>
