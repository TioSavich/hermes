  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: substitute_values</title><tspan x="408.3" y="383.8">substitute_target</tspan><tspan x="408.3" y="394.2">into_polynomial</tspan></text>
