  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: read_operand_attribute</title><tspan x="368.6" y="222.1">identify_limit</tspan><tspan x="368.6" y="232.5">target</tspan></text>
  <path class="edge-conserving" d="M 415.6 271.7 Q 460.5 292.8 427.6 324.5" fill="none" stroke="#0d0c08" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-conserving)"><title>recognize_polynomial_is_continuous → test_criteria (conserving)</title></path>
