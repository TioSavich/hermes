  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: iterate_unit</title><tspan x="493.8" y="368.1">iterate_unit</tspan><tspan x="493.8" y="378.5">fraction_back_to</tspan><tspan x="493.8" y="388.9">whole</tspan></text>
