  <path class="validity-rust-overlay" d="M 226.5 356.0 Q 184.0 320.0 226.5 291.0" fill="none" stroke="#b95238" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-validity-rust)"><title>lose_outer_referent → record_loss; modes objective_invalid; review status adjudicated</title></path>
  <circle class="validity-rust-ring" cx="226.5" cy="266.0" r="23.5" fill="none" stroke="#b95238" stroke-width="1.5"/>
  <circle class="validity-rust-ring" cx="226.5" cy="374.0" r="23.5" fill="none" stroke="#b95238" stroke-width="1.5"/>
