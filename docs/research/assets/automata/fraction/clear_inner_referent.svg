<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">fraction / clear_inner_referent</title>
  <desc id="desc">States are arranged radially. Dark and muted lines record conserving and neutral stances. For deforming transitions, blue records a correct doing the context makes insufficient; rust records a claim that is false on its own. Mixed transitions have a blue base and rust overlay. Unreviewed rows remain rust.</desc>
  <defs>
    <marker id="arrow-conserving" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0d0c08"/></marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#665f4f"/></marker>
    <marker id="arrow-validity-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e6f9e"/></marker>
    <marker id="arrow-validity-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b95238"/></marker>
    <marker id="arrow-validity-rust-mixed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b95238"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d4a747"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f4ead6"/>
  <path class="edge-neutral" d="M 335.6 221.0 Q 388.0 202.2 391.9 253.5" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>partition_whole_into_equal_units → partition_into_equal_parts (neutral)</title></path>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: partition_into_equal_parts</title><tspan x="368.9" y="226.7">partition_whole</tspan><tspan x="368.9" y="237.1">into_equal_units</tspan></text>
  <path class="edge-neutral" d="M 413.5 284.0 Q 456.0 320.0 413.5 349.0" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>partition_that_part_again → partition_into_equal_parts (neutral)</title></path>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: partition_into_equal_parts</title><tspan x="420.8" y="313.1">partition_that_part</tspan><tspan x="420.8" y="323.4">again</tspan></text>
  <path class="edge-neutral" d="M 397.9 383.0 Q 388.0 437.8 341.7 415.5" fill="none" stroke="#665f4f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"><title>name_inner_part_relative_to_outer_part → name_result (neutral)</title></path>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#665f4f" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: name_result</title><tspan x="371.9" y="396.0">name_inner_part</tspan><tspan x="371.9" y="406.4">relative_to_outer</tspan><tspan x="371.9" y="416.8">part</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#b95238" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: omit_required_step</title><tspan x="271.1" y="397.7">fail_to_relate</tspan><tspan x="271.1" y="408.1">inner_part_to</tspan><tspan x="271.1" y="418.5">original_whole</tspan></text>
  <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.0" fill="#b95238" stroke="#f4ead6" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill"><title>Canonical action: record_loss</title><tspan x="219.2" y="321.8">lose_outer_referent</tspan></text>
