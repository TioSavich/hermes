<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 308" role="img" aria-label="render filmstrip"><rect x="0" y="0" width="980" height="308" fill="#f8f1df"/><text x="172" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1b1810">Frame 1</text><text x="172" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5a5446">Start with one ray from the vertex along the baseline.</text><g transform="translate(56.554455445544555 67.04950495049505) scale(0.5247524752475248)"><rect x="18" y="-2" width="404" height="404" fill="#f8f1df" stroke="#0d0c08" stroke-width="0"></rect><line x1="220" y1="200" x2="370" y2="200" stroke="#0d0c08" stroke-width="1.8"></line><circle cx="220" cy="200" r="3" fill="#0d0c08" stroke="#0d0c08" stroke-width="1"></circle><text x="294" y="200" text-anchor="middle" dominant-baseline="central" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="12" fill="#1b1810">0°</text></g><text x="490" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1b1810">Frame 2</text><text x="490" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5a5446">Turn through 35 degrees: the angle is the amount of turn, not the length of the rays.</text><g transform="translate(374.55445544554453 67.04950495049505) scale(0.5247524752475248)"><rect x="18" y="-2" width="404" height="404" fill="#f8f1df" stroke="#0d0c08" stroke-width="0"></rect><path d="M220 200 L276 200 L275.71001790457785 194.3084356217631 L274.8430748188709 188.6758159494059 L273.40814924190073 183.1604752277607 L271.42010198529533 177.81953310180722 L268.89952226724296 172.70830305687443 L265.87251448018355 167.87971956434143 Z" fill="none" stroke="#0d0c08" stroke-width="0.6"></path><line x1="220" y1="200" x2="370" y2="200" stroke="#0d0c08" stroke-width="1.8"></line><circle cx="220" cy="200" r="3" fill="#0d0c08" stroke="#0d0c08" st